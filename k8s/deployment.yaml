apiVersion: apps/v1
kind: Deployment
metadata:
  name: radicale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radicale
  template:
    metadata:
      labels:
        app: radicale
    spec:
      containers:
      - name: radicale
        image: fasloli/radicale:stable
        ports:
        - containerPort: 5232
        volumeMounts:
        - name: radicale-data
          mountPath: /data
        - name: radicale-config
          mountPath: /config
      volumes:
      - name: radicale-data
        persistentVolumeClaim:
          claimName: radicale-pvc
      - name: radicale-config
        hostPath:
          path: /home/fasloli/docker-shallow-dive/docker-radicale-fasloli/config
